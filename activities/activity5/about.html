<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsuki Cafe - About Us</title>
    <link rel="stylesheet" href="about.css">
</head>
<body>
    <header class="banner">
        <h1>Tsuki Cafe</h1>
        <p>Where the moon meets the morning brew</p>
    </header>

    <nav class="navigation">
        <a href="index.html" class="nav-link">🏠 Home</a>
        <a href="products.html" class="nav-link">☕ Products</a>
        <a href="about.html" class="nav-link active">📜 About Us</a>
    </nav>

    <main class="content">
        <section class="story">
            <h2>Our Story</h2>
            <p>Founded in 2023, Tsuki Cafe was born from a love of quiet mornings and strong coffee. We source our beans ethically and roast them in-house.</p>
        </section>

        <section class="contact">
            <h2>Contact Us</h2>
            <form>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label>How can we help u?</label>
                    <textarea rows="4" placeholder="Write your message..." required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>
    </main>

    <section class="iframe-section">
        <h2>Find Us</h2>
        <div class="iframe-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.0!2d121.0!3d14.5!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTTCsDMwJzAwLjAiTiAxMjHCsDAwJzAwLjAiRQ!5e0!3m2!1sen!2sph!4v1234567890" 
                width="400" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy"
                class="map-iframe">
            </iframe>
        </div>
    </section>
</body>
</html>
